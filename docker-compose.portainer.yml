# Garage-server overrides for the Portainer Git stack.
# Merge order in Portainer: docker-compose.yml -> docker-compose.build.yml -> this file.
# Reproduces the original release-image stack: data on the host, no published
# ports, frontend reachable only through the shared proxy network.
#
# `ports: !reset []` needs Docker Compose v2.24+. If Portainer rejects it,
# delete those two lines (the stack then also publishes the default ports).

services:
  postgres:
    networks:
      - pokelocal_internal

  backend:
    networks:
      - pokelocal_internal
    build:
      args:
        # The GPU variant of the backend image (CUDA 12 ONNX Runtime); docs/CARD_MATCH.md "Running on the GPU".
        # The nonprod stack merges this file too, so it gets the GPU settings from here.
        CARD_MATCH_GPU: "1"
    # The server's Quadro P620 for the picture matcher. It is shared with the nonprod stack and Jellyfin, which is why
    # there is a memory cap and an idle unload below. Falls back to the CPU by itself if the card is missing or full.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # Picture matcher on the GPU (auto = GPU when it works, else CPU), kept warm: models load at startup and run one dummy scan.
      CARD_MATCH_DEVICE: auto
      CARD_MATCH_GPU_MEM_MB: "1024"
      CARD_MATCH_WARM: "1"
      # Release the GPU sessions after 10 idle minutes (the card is shared with Jellyfin and nonprod); the scan screen warms them again.
      CARD_MATCH_IDLE_UNLOAD_MINUTES: "10"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Picture matcher (docs/CARD_MATCH.md, "Running it on prod"). None of this changes a scan until an admin
      # builds the picture indexes in Scanner lab and switches "Picture match first" on in Settings > Scanner.
      # The option set is the 19 Nov 2026 pin (77.7% decided, 0 wrong on 287 real photos) plus the calibrated custom picture model (see below).
      # Promote a better one by changing it here.
      CARD_MATCH_OPTIONS: ${CARD_MATCH_OPTIONS:-names+number+text+art+tta+fastread+numberonce+corners+wholepic+wholeread+widefirst+topname+edgeguard+custom+calibrated}
      # The calibrated custom picture model (19 Nov 2026: 82.6% decided, 0 wrong on 287 real photos, against 77.7% for the set before it).
      # The owner uploads dinov2-small-cards-2026-11-18.onnx in Scanner lab (Custom picture models); its id is custom-<first 8 of its sha256>,
      # the same on every server. Until it is uploaded and both its indexes are built, "custom" and "calibrated" do nothing and the set runs as before.
      # The thresholds below were worked out on nonprod, so this stack needs no calibration of its own (a calibration stored on the model wins).
      CARD_MATCH_CUSTOM_MODEL: custom-f718bb84
      CARD_MATCH_CUSTOM_CALIBRATION: '{"model":"custom-f718bb84","source":"nonprod autorun 2026-11-19T06:33:16Z, 139 Tuned scans, 129 decided, 0 wrong","at":"2026-11-19T06:33:16+00:00","thresholds":{"sim_min_with_rules":0.30,"sim_min_picture_only":0.65,"lead_min_picture_only":0.10,"sim_min_picture_strong":0.81,"lead_min_picture_strong":0.13,"sim_min_name_picture":0.65,"lead_min_name_picture":0.06,"lookup_sim_set":0.31,"lookup_sim_total":0.37,"whole_sim_min":0.37,"reprint_art_lead":0.08,"same_name_picture_margin":0.10}}'
      # Set to 1 in the stack's environment to add new card pictures to the index after each card sync.
      SCAN_MATCHER_INDEX_AFTER_SYNC: ${SCAN_MATCHER_INDEX_AFTER_SYNC:-}
      # Default for the admin switch "Picture match first". Unset means off.
      SCAN_PICTURE_FIRST: ${SCAN_PICTURE_FIRST:-}
      # Scanner diagnostics (docs/CARD_MATCH.md, "Running it on prod"): every trainer's scans are kept on this server
      # for testing card recognition; only an admin can switch it off for themselves or delete a trainer's data.
      # Photos never leave the server. Set SCAN_TRACE_REQUIRED to 0 in the stack's environment to go back to opt-in.
      SCAN_TRACE_DIR: ${SCAN_TRACE_DIR:-/app/data/scan-traces}
      SCAN_TRACE_REQUIRED: ${SCAN_TRACE_REQUIRED:-1}
      # Days to keep them (365 = 12 months). 0 keeps everything (empty falls back to 365).
      SCAN_TRACE_KEEP_DAYS: ${SCAN_TRACE_KEEP_DAYS:-365}
    # Same container paths as the base file, so these replace its ./data/... mounts.
    volumes:
      - /home/rage/Documents/docker/pokelocal/backups:/app/backups
      - /home/rage/Documents/docker/pokelocal/data/auth:/app/data/auth
      - /home/rage/Documents/docker/pokelocal/data/pokedex-images:/app/data/pokedex-images
      - /home/rage/Documents/docker/pokelocal/data/scan-uploads:/app/data/scan-uploads
      - /home/rage/Documents/docker/pokelocal/data/scan-traces:/app/data/scan-traces
      # The picture indexes and Scanner lab reports, so they survive a redeploy.
      - /home/rage/Documents/docker/pokelocal/data/card-match:/app/data/card-match
    ports: !reset []

  frontend:
    networks:
      - pokelocal_internal
      - garage_network
    ports: !reset []

networks:
  # Private network for frontend <-> backend <-> postgres
  pokelocal_internal:
    driver: bridge
  # Shared with Nginx Proxy Manager; only the frontend joins it
  garage_network:
    external: true