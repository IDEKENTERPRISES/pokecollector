<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pokemon TCG Collection</title>
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/pokeball.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/pc-apple-touch-180-v3.png" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <!-- iOS home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PokéCollector" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Dark fallback until the app stylesheet applies. The layer is declared first, so it has
         the lowest priority and every app style and theme still overrides it. -->
    <style>@layer pc-fallback { html, body { background-color: #000000; color: #fff; } }</style>
  </head>
  <body class="bg-bg text-white font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
