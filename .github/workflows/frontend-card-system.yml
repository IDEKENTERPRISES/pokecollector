name: Frontend Card System

on:
  pull_request:
    paths:
      - frontend/**
      - docs/CARD_SYSTEM.md
      - docs/FRONTEND.md
      - CONTRIBUTING.md
      - .github/workflows/frontend-card-system.yml
  push:
    branches:
      - main
    paths:
      - frontend/**
      - docs/CARD_SYSTEM.md
      - docs/FRONTEND.md
      - CONTRIBUTING.md
      - .github/workflows/frontend-card-system.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  card-system:
    runs-on: ubuntu-latest
    # Same image the Linux snapshots are generated in, so fonts and rendering match.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth_header}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: Basic ${auth_header}" fetch --force origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Show Node.js toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run translation and unit tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Run desktop and mobile visual regression tests
        run: npm run test:visual

      - name: Run WebKit card-list regression test
        run: npm run test:visual:webkit

      - name: Run PWA service-worker tests (Chromium)
        run: npm run test:pwa
